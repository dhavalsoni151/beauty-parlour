name: beauty_parlour
description: Beauty Parlour Management App — manage customers, services, billing, expenses and reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Charts
  fl_chart: ^0.69.0

  # Excel Export
  excel: ^4.0.6

  # File handling
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  file_picker: ^8.1.2

  # Date & Time
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.5.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
