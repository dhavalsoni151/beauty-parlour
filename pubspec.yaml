name: beauty_parlour
description: Beauty Parlour Management App — manage customers, services, billing, expenses and reports.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase foundation
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_app_check: ^0.4.0+1
  connectivity_plus: ^6.1.5

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Charts
  fl_chart: ^0.69.0

  # Excel Export
  excel: ^4.0.6

  # File handling
  path_provider: ^2.1.4
  share_plus: ^13.3.0
  file_picker: ^12.1.3

  # Date & Time
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.5.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Icons
  cupertino_icons: ^1.0.8

  # PIN hashing (app lock)
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
